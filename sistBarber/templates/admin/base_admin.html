{% extends 'base.html' %}

{% block content %}
<div class="py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <!-- ADMIN TOPBAR / HEADER -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-dark-800 mb-8">
            <div>
                <div class="flex items-center gap-3">
                    <span class="px-2.5 py-1 rounded-md text-[10px] font-extrabold uppercase tracking-widest bg-gold-400 text-dark-950">
                        Admin Mode
                    </span>
                    <span class="text-xs text-gray-400">Olá, <strong class="text-white">{{ current_user.name }}</strong></span>
                </div>
                <h1 class="font-serif text-2xl sm:text-3xl font-extrabold text-white mt-1">
                    {% block admin_title %}Painel de Controle{% endblock %}
                </h1>
            </div>

            <!-- Botão de Disparo / Teste de Lembretes Automáticos -->
            <div class="flex flex-wrap items-center gap-3">
                
                <!-- Formulário de disparo de simulação -->
                <form action="{{ url_for('trigger_reminders') }}" method="POST" class="inline-flex">
                    <input type="hidden" name="hours" value="24">
                    <button type="submit" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider bg-gold-400/10 hover:bg-gold-400 text-gold-400 hover:text-dark-950 border border-gold-400/30 hover:border-gold-400 transition-all shadow-sm">
                        <i class="fas fa-bell text-sm"></i>
                        <span>Testar Disparo de Lembretes (24h)</span>
                    </button>
                </form>

                <a href="{{ url_for('index') }}" target="_blank" class="inline-flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-300 bg-dark-850 hover:bg-dark-800 border border-dark-700 transition">
                    <i class="fas fa-external-link-alt text-xs text-gold-400"></i>
                    <span>Ver Barbearia Online</span>
                </a>
            </div>
        </div>

        <!-- ADMIN SUBNAV TABS -->
        <div class="flex border-b border-dark-800 space-x-2 sm:space-x-8 mb-8 overflow-x-auto pb-px">
            <a href="{{ url_for('admin_dashboard') }}" 
               class="flex items-center gap-2.5 py-3.5 px-3 border-b-2 font-semibold text-sm transition-all whitespace-nowrap {% if request.endpoint == 'admin_dashboard' %}border-gold-400 text-gold-400{% else %}border-transparent text-gray-400 hover:text-gray-200 hover:border-dark-600{% endif %}">
                <i class="fas fa-chart-line"></i>
                <span>Visão Geral & Métricas</span>
            </a>

            <a href="{{ url_for('admin_agendamentos') }}" 
               class="flex items-center gap-2.5 py-3.5 px-3 border-b-2 font-semibold text-sm transition-all whitespace-nowrap {% if request.endpoint == 'admin_agendamentos' %}border-gold-400 text-gold-400{% else %}border-transparent text-gray-400 hover:text-gray-200 hover:border-dark-600{% endif %}">
                <i class="fas fa-calendar-alt"></i>
                <span>Gestão de Agendamentos</span>
            </a>

            <a href="{{ url_for('admin_pacotes') }}" 
               class="flex items-center gap-2.5 py-3.5 px-3 border-b-2 font-semibold text-sm transition-all whitespace-nowrap {% if request.endpoint in ['admin_pacotes', 'create_package', 'edit_package'] %}border-gold-400 text-gold-400{% else %}border-transparent text-gray-400 hover:text-gray-200 hover:border-dark-600{% endif %}">
                <i class="fas fa-tags"></i>
                <span>Gestão de Pacotes & Preços (CRUD)</span>
            </a>
        </div>

        <!-- CONTEÚDO ESPECÍFICO DO ADMIN -->
        {% block admin_content %}{% endblock %}

    </div>
</div>
{% endblock %}
